name: Authenticated acceptance
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, macos, windows]
    # Configure dedicated machines and this protected environment before enabling this job.
    # Provider login is installed on these runners; credentials are never passed as arguments.
    runs-on: [self-hosted, casimir-acceptance, "${{ matrix.platform }}"]
    environment: authenticated-acceptance
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release
      - name: Run authenticated task suite
        if: runner.os != 'Windows'
        run: python scripts/acceptance.py --casimir target/release/casimir --output .context/acceptance --allow-subscription-usage
      - name: Run authenticated task suite
        if: runner.os == 'Windows'
        run: python scripts/acceptance.py --casimir target/release/casimir.exe --output .context/acceptance --allow-subscription-usage
      - name: Run authenticated recovery and checkpoint workflows
        if: runner.os != 'Windows'
        run: python scripts/native-workflows.py --casimir target/release/casimir --output .context/native-workflows --claude-permission-mode acceptEdits --allow-subscription-usage
      - name: Run authenticated recovery and checkpoint workflows
        if: runner.os == 'Windows'
        run: python scripts/native-workflows.py --casimir target/release/casimir.exe --output .context/native-workflows --claude-permission-mode acceptEdits --allow-subscription-usage
      - name: Build redacted acceptance receipt
        run: python scripts/summarize-acceptance.py --acceptance .context/acceptance/acceptance.json --native .context/native-workflows/native-workflows.json --output acceptance-summary.json
      - uses: actions/upload-artifact@v4
        with:
          name: authenticated-${{ matrix.platform }}
          path: acceptance-summary.json
          if-no-files-found: error
          retention-days: 90
      # Raw logs and snapshots remain on the protected runner.
