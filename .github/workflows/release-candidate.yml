name: Native release archives
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Cargo.toml (1.0.0-rc.N or 1.0.0)
        required: true
      evidence_run:
        description: Protected workflow run containing the release-evidence artifact for this commit
        required: true
permissions:
  contents: read
  actions: read
jobs:
  gates:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify evidence workflow provenance
        env:
          EVIDENCE_RUN: ${{ inputs.evidence_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .context
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN" > .context/evidence-run.json
          python - <<'PY'
          import json, os
          run = json.load(open('.context/evidence-run.json'))
          assert run['head_sha'] == os.environ['GITHUB_SHA'], 'evidence workflow commit mismatch'
          assert run['path'] == '.github/workflows/release-evidence.yml', 'unexpected evidence workflow'
          assert run['event'] == 'workflow_dispatch' and run['conclusion'] == 'success', 'evidence workflow did not pass manual protected gating'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: .context/release-evidence
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
      - name: Verify release evidence
        env:
          VERSION: ${{ inputs.version }}
          EVIDENCE: .context/release-evidence/release-evidence.json
        run: |
          if [[ "$VERSION" == *-rc.* ]]; then STAGE=rc; else STAGE=1.0; fi
          python scripts/release-gates.py --evidence "$EVIDENCE" --commit "$GITHUB_SHA" --stage "$STAGE"
  archives:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and verify installation
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: python scripts/package-release.py --target "$env:TARGET" --version "$env:VERSION"
        if: runner.os == 'Windows'
      - name: Package and verify installation
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: python scripts/package-release.py --target "$TARGET" --version "$VERSION"
        if: runner.os != 'Windows'
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/casimir-*
      - uses: actions/upload-artifact@v4
        with:
          name: casimir-${{ matrix.target }}
          path: dist/*
  publish:
    needs: archives
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          EXTRA=()
          if [[ "$VERSION" == *-rc.* ]]; then EXTRA+=(--prerelease); fi
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --draft "${EXTRA[@]}" --title "Casimir $VERSION" --notes-file CHANGELOG.md
