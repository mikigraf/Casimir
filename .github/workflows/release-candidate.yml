name: Native release archives
on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching Cargo.toml (1.0.0-rc.N or 1.0.0)
        required: true
      evidence_run:
        description: Protected workflow run containing the release-evidence artifact for this commit
        required: true
permissions:
  contents: read
  actions: read
  attestations: read
jobs:
  gates:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify evidence workflow provenance
        env:
          EVIDENCE_RUN: ${{ inputs.evidence_run }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .context
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$EVIDENCE_RUN" > .context/evidence-run.json
          python - <<'PY'
          import json, os
          run = json.load(open('.context/evidence-run.json'))
          assert run['head_sha'] == os.environ['GITHUB_SHA'], 'evidence workflow commit mismatch'
          expected = '.github/workflows/release-evidence.yml'
          path = run['path']
          branch = run.get('head_branch')
          allowed = {run['head_sha']}
          if branch:
              allowed.update((branch, 'refs/heads/' + branch, 'refs/tags/' + branch))
          assert path == expected or (path.startswith(expected + '@') and path[len(expected) + 1:] in allowed), 'unexpected evidence workflow'
          assert run['event'] == 'workflow_dispatch' and run['conclusion'] == 'success', 'evidence workflow did not pass manual protected gating'
          PY
      - uses: actions/download-artifact@v4
        with:
          name: release-evidence
          path: .context/release-evidence
          run-id: ${{ inputs.evidence_run }}
          github-token: ${{ github.token }}
      - name: Verify release evidence
        env:
          VERSION: ${{ inputs.version }}
          EVIDENCE: .context/release-evidence/release-evidence.json
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import os, pathlib, tomllib
          actual = tomllib.loads(pathlib.Path('Cargo.toml').read_text())['package']['version']
          assert actual == os.environ['VERSION'], 'requested version differs from Cargo.toml'
          PY
          if [[ "$VERSION" == *-rc.* ]]; then STAGE=rc; else STAGE=1.0; fi
          python scripts/release-gates.py --evidence "$EVIDENCE" --commit "$GITHUB_SHA" --stage "$STAGE" --verify-github
  archives:
    needs: gates
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: macos-14, target: aarch64-apple-darwin}
          - {os: macos-15-intel, target: x86_64-apple-darwin}
          - {os: ubuntu-latest, target: x86_64-unknown-linux-gnu}
          - {os: windows-latest, target: x86_64-pc-windows-msvc}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: cargo test --locked --all-targets
      - run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package and verify installation
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: python scripts/package-release.py --target "$env:TARGET" --version "$env:VERSION"
        if: runner.os == 'Windows'
      - name: Package and verify installation
        env:
          VERSION: ${{ inputs.version }}
          TARGET: ${{ matrix.target }}
        run: python scripts/package-release.py --target "$TARGET" --version "$VERSION"
        if: runner.os != 'Windows'
      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/casimir-*
      - uses: actions/upload-artifact@v4
        with:
          name: casimir-${{ matrix.target }}
          path: dist/*
  publish:
    needs: archives
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create reviewable draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: |
          python - <<'PY'
          import os, subprocess
          tag = 'refs/tags/v' + os.environ['VERSION']
          output = subprocess.check_output(['git', 'ls-remote', '--tags', 'origin', tag, tag + '^{}'], text=True)
          refs = dict(line.split('\t', 1)[::-1] for line in output.splitlines())
          existing = refs.get(tag + '^{}', refs.get(tag))
          if existing and existing != os.environ['GITHUB_SHA']:
              raise SystemExit('release tag already points to another commit')
          PY
          EXTRA=()
          if [[ "$VERSION" == *-rc.* ]]; then EXTRA+=(--prerelease); fi
          gh release create "v$VERSION" dist/* --target "$GITHUB_SHA" --draft "${EXTRA[@]}" --title "Casimir $VERSION" --notes-file CHANGELOG.md
