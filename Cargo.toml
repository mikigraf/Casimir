[package]
name = "casimir"
version = "1.0.0-rc.1"
edition = "2021"
rust-version = "1.85"
description = "Replay, rerun and compare coding-agent sessions from Claude Code and Codex"
license = "MIT"
repository = "https://github.com/mikigraf/Casimir"

[lib]
name = "casimir"
path = "src/lib.rs"

[[bin]]
name = "casimir"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
tempfile = "3"
fs2 = "0.4"
ctrlc = { version = "3", features = ["termination"] }
libc = "0.2"
ureq = { version = "2.12", features = ["json"] }
regex = "1"

[profile.release]
strip = true
lto = true

[dev-dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_Security", "Win32_Security_Authorization"] }
